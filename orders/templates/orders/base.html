<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Purchase orders{% endblock %} · PEP Brands</title>
  <style>{% include "orders/style.css" %}</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="mast"><div class="bar">
  <a class="brand" href="{% url 'workspace' %}"><span class="mark" aria-hidden="true">P</span>PEP Brands</a>
  <span class="division">Procurement</span>
  {% if user.is_authenticated %}<div class="account"><span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout">Sign out</button></form></div>{% endif %}
</div></header>
<main id="main">{% block content %}{% endblock %}</main>
<footer><a href="/health">Check database connection ↗</a></footer>
</body></html>
