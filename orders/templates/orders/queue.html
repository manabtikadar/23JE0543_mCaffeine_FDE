{% extends "orders/base.html" %}
{% block content %}
<p><a href="/">Purchase orders</a></p>
<h1>Submitted purchase orders</h1>
<ul>{% for order in orders %}
  <li><a href="{% url 'draft-detail' order.pk %}">{{ order.number }}</a> · {{ order.vendor }}</li>
{% empty %}<li>No orders awaiting a decision.</li>{% endfor %}</ul>
{% endblock %}
