{% if orders %}<table class="orders"><thead><tr><th scope="col">PO number</th><th scope="col">Vendor</th><th scope="col">Status</th></tr></thead>
<tbody>{% for order in orders %}<tr><td><a href="{% url 'draft-detail' order.pk %}">{{ order.number|default:"Unnumbered draft" }}</a></td><td>{{ order.vendor|default:"—" }}</td><td><span class="status {{ order.status }}">{{ order.get_status_display }}</span></td></tr>{% endfor %}</tbody></table>
{% else %}<p class="empty">{{ empty_message|default:"No purchase orders to display." }}</p>{% endif %}
